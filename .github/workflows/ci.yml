name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: ruff · ty · pytest · package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

      - name: Type check (ty)
        run: uv run ty check

      - name: Unit and integration tests
        run: uv run pytest -m "not live" --cov=holds --cov-report=term-missing

      - name: CRAP quality gate
        run: uv run python scripts/check_crap.py

      - name: Build package
        run: uv build

  e2e-deterministic:
    name: framework e2e (deterministic stub)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync --extra dev --extra e2e

      - name: Install package entrypoint
        run: uv pip install -e .

      - name: Black-box framework compatibility
        run: uv run pytest -m "e2e and not live" -q

  holds-gate:
    name: holds run · compare
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Install package entrypoint
        run: uv pip install -e .

      - name: Holds merge gate
        uses: ./.github/actions/holds-run
        with:
          working-directory: examples/deterministic_agent
          suite: holds.yaml
          report: artifacts/holds_report.json
          baseline: baselines/accepted.json
          artifact-name: holds-deterministic-agent
