name: Live framework smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    name: opt-in live provider smoke
    runs-on: ubuntu-latest
    steps:
      - name: Require live endpoint secret
        env:
          HOLDS_LIVE_BASE_URL: ${{ secrets.HOLDS_LIVE_BASE_URL }}
        run: |
          if [ -z "${HOLDS_LIVE_BASE_URL}" ]; then
            echo "HOLDS_LIVE_BASE_URL is not configured."
            echo "Set repo secrets HOLDS_LIVE_BASE_URL, HOLDS_LIVE_API_KEY, and HOLDS_LIVE_MODEL before dispatching."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync --extra dev --extra e2e

      - name: Live smoke
        env:
          HOLDS_LIVE_BASE_URL: ${{ secrets.HOLDS_LIVE_BASE_URL }}
          HOLDS_LIVE_API_KEY: ${{ secrets.HOLDS_LIVE_API_KEY }}
          HOLDS_LIVE_MODEL: ${{ secrets.HOLDS_LIVE_MODEL }}
        run: uv run pytest -m live -q
