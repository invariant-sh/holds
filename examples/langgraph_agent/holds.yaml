version: 1
agent:
  command: "python agent.py"
  result_path: "artifacts/result.json"
defaults:
  repeats: 1
  timeout_seconds: 30
tasks:
  - id: langgraph-classify-refund
    input:
      customer_message: "I need a refund for a double charge."
    expected:
      category: refund_request
    graders:
      - type: exact_field
        path: "$.category"
        equals: refund_request
    thresholds:
      pass_rate_gte: 1.0
