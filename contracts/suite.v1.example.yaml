version: 1
agent:
  command: "python agent.py"
  result_path: "artifacts/result.json"

defaults:
  repeats: 3
  timeout_seconds: 60
  seed: 42

thresholds:
  pass_rate_gte: 0.95
  schema_valid_rate_gte: 1.0
  max_regression_points: 1.0

tasks:
  - id: classify-refund-request
    input:
      customer_message: "I was charged twice for my subscription."
    expected:
      category: refund_request
    graders:
      - type: json_schema
        schema: schemas/support_response.json
      - type: exact_field
        path: "$.category"
        equals: refund_request
      - type: python
        callable: graders.support:no_unapproved_refund
    thresholds:
      pass_rate_gte: 0.95
      schema_valid_rate_gte: 1.0
